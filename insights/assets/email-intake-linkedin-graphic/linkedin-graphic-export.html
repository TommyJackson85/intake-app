<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn graphic export — Article 1</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }

      .stage {
        width: 1080px;
        height: 1350px;
        margin: 0 auto;
        overflow: hidden;
      }

      .stage img,
      .stage object,
      .stage svg {
        display: block;
        width: 1080px;
        height: 1350px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- Inline-friendly export surface for Playwright screenshot at 1080×1350 -->
      <img
        src="./client-intake-email-workflow-linkedin.svg"
        width="1080"
        height="1350"
        alt="Client Intake LinkedIn graphic draft"
      >
    </div>
  </body>
</html>
