<svg
  width="1080"
  height="1350"
  viewBox="0 0 1080 1350"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="linkedin-graphic-title linkedin-graphic-desc"
>
  <title id="linkedin-graphic-title">
    Client Intake LinkedIn graphic: A file is not ready because a client replied. It is ready when
    the team can see what was received, what is missing, who owns the next step, and what blocks the
    handoff.
  </title>
  <desc id="linkedin-graphic-desc">
    Portrait social graphic for a personal LinkedIn post promoting the Insights article on a
    file-ready checklist for real-estate transaction teams. Dark navy type panel sits above the
    checklist illustration.
  </desc>

  <defs>
    <linearGradient id="panelFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2742" stop-opacity="1" />
      <stop offset="78%" stop-color="#0F2742" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0F2742" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background: Canva Image 6 (text-free). -->
  <image
    href="linkedin-file-ready-background.png"
    x="0"
    y="0"
    width="1080"
    height="1350"
    preserveAspectRatio="xMidYMid slice"
  />

  <!-- Top navy overlay for type; fades so the bottom illustration stays visible -->
  <rect x="0" y="0" width="1080" height="820" fill="url(#panelFade)" />

  <text
    x="72"
    y="110"
    fill="#A7F3D0"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="0.18em"
  >
    CLIENT INTAKE
  </text>

  <text
    x="72"
    y="200"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="46"
    font-weight="700"
  >
    <tspan x="72" dy="0">A file is not ready</tspan>
    <tspan x="72" dy="62">because a client replied.</tspan>
  </text>

  <text
    x="72"
    y="370"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="34"
    font-weight="700"
  >
    It is ready when the team can see:
  </text>

  <text
    x="72"
    y="450"
    fill="#F3F7FA"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="600"
  >
    <tspan x="72" dy="0">
      <tspan fill="#2DD4BF">•</tspan>
      <tspan>  What was received</tspan>
    </tspan>
    <tspan x="72" dy="54">
      <tspan fill="#F59E0B">•</tspan>
      <tspan>  What is missing</tspan>
    </tspan>
    <tspan x="72" dy="54">
      <tspan fill="#2DD4BF">•</tspan>
      <tspan>  Who owns the next step</tspan>
    </tspan>
    <tspan x="72" dy="54">
      <tspan fill="#2DD4BF">•</tspan>
      <tspan>  What blocks the handoff</tspan>
    </tspan>
  </text>
</svg>
