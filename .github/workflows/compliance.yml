name: Compliance checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Skip lifecycle scripts: the supabase CLI postinstall downloads a binary
        # from GitHub Releases and can flake with Z_DATA_ERROR / incorrect header check.
        # check:compliance only needs TypeScript + local SQL/docs files, not the CLI.
        run: npm install --ignore-scripts

      - name: Run compliance checks
        run: npm run check:compliance
