<svg
  width="1080"
  height="1350"
  viewBox="0 0 1080 1350"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="linkedin-graphic-title linkedin-graphic-desc"
>
  <title id="linkedin-graphic-title">
    Client Intake LinkedIn graphic: Email is useful for communication. It is not a complete intake
    workflow.
  </title>
  <desc id="linkedin-graphic-desc">
    Portrait social graphic for a personal LinkedIn post promoting the Insights article on
    email-based client intake delays.
  </desc>

  <defs>
    <linearGradient id="bottomGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2742" stop-opacity="0" />
      <stop offset="55%" stop-color="#0F2742" stop-opacity="0" />
      <stop offset="100%" stop-color="#0F2742" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Background: Canva Image 5 (text-free). Place linkedin-email-intake-background.png beside this SVG. -->
  <image
    href="linkedin-email-intake-background.png"
    x="0"
    y="0"
    width="1080"
    height="1350"
    preserveAspectRatio="xMidYMid slice"
  />

  <rect x="0" y="0" width="720" height="1350" fill="#0F2742" fill-opacity="0.90" />
  <rect x="0" y="0" width="1080" height="1350" fill="url(#bottomGradient)" />

  <text
    x="72"
    y="140"
    fill="#2DD4BF"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="0.18em"
  >
    CLIENT INTAKE
  </text>

  <text
    x="72"
    y="250"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="48"
    font-weight="700"
  >
    <tspan x="72" dy="0">Email is useful for</tspan>
    <tspan x="72" dy="64">communication.</tspan>
    <tspan x="72" dy="84">It is not a complete</tspan>
    <tspan x="72" dy="64">intake workflow.</tspan>
  </text>

  <text
    x="72"
    y="620"
    fill="#E8F4F1"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="36"
    font-weight="600"
  >
    <tspan x="72" dy="0">Information.</tspan>
    <tspan x="72" dy="58">Documents.</tspan>
    <tspan x="72" dy="58">Follow-ups.</tspan>
    <tspan x="72" dy="58">Ownership.</tspan>
    <tspan x="72" dy="58">Blockers.</tspan>
  </text>

  <text
    x="72"
    y="1060"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="42"
    font-weight="700"
  >
    All need to be visible.
  </text>
</svg>
